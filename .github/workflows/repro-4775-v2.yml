name: Reproduce #4775 supported backend v2

on:
  push:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.14"
          python-version: "3.13"
      - run: uv run --extra sqlalchemy pytest -q tests/extensions/memory/test_sqlalchemy_session.py -k test_runner_pending_input_duplicates_with_supported_sqlalchemy_session_after_lost_ack
