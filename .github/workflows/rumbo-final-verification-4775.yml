name: RUMBO Final Verification #4775

on:
  push:
    branches:
      - sync/issue-4775-on-main-987b083e-20260920

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: make sync
      - name: Verify formatting
        run: make format-check
      - name: Run lint
        run: make lint
      - name: Run typecheck
        run: make typecheck
      - name: Run full test suite
        run: make tests-parallel
