name: RUMBO Tests Only #4775

on:
  push:
    branches:
      - ci/verify-4775-tests-only-20260920

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: "0.11.14"
          enable-cache: true
          prune-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: make sync
      - name: Run full test suite
        run: make tests-parallel
